<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101010">
  <title>Gubka-GPT</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101010;
      --panel: #171717;
      --panel2: #202020;
      --border: #303030;
      --text: #f2f2f2;
      --muted: #929292;
      --accent: #d7ff45;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, textarea { font: inherit; }

    .app {
      display: flex;
      width: 100%;
      height: 100%;
    }

    .sidebar {
      width: 270px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      padding: 18px 14px;
      background: #151515;
      border-right: 1px solid var(--border);
      transition: transform .25s ease;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 5px 8px 24px;
      font-size: 19px;
      font-weight: 750;
      letter-spacing: -.5px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: var(--accent);
      color: #111;
      font-weight: 900;
    }

    .new-chat {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel2);
      color: white;
      text-align: left;
      cursor: pointer;
      transition: .2s;
    }

    .new-chat:hover { background: #292929; }

    .history-title {
      margin: 28px 8px 10px;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .history {
      flex: 1;
      overflow-y: auto;
    }

    .history-item {
      display: block;
      width: 100%;
      padding: 11px 10px;
      margin-bottom: 4px;
      overflow: hidden;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #c9c9c9;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }

    .history-item:hover,
    .history-item.active {
      background: #252525;
      color: white;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 15px 5px 3px;
      border-top: 1px solid var(--border);
    }

    .avatar {
      width: 35px;
      height: 35px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #303030;
      font-weight: 700;
    }

    .profile-name { font-size: 13px; }
    .profile-status { margin-top: 3px; color: var(--muted); font-size: 11px; }

    .main {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .topbar {
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid var(--border);
    }

    .top-title { font-weight: 650; }

    .model {
      padding: 7px 11px;
      border: 1px solid var(--border);
      border-radius: 20px;
      color: #c7c7c7;
      font-size: 12px;
    }

    .menu-button {
      display: none;
      border: 0;
      background: transparent;
      color: white;
      font-size: 23px;
      cursor: pointer;
    }

    .messages {
      flex: 1;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 28px 25px 20px;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .welcome {
      min-height: 65%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .welcome-logo {
      width: 65px;
      height: 65px;
      display: grid;
      place-items: center;
      margin-bottom: 22px;
      border-radius: 22px;
      background: var(--accent);
      color: #111;
      font-size: 29px;
      font-weight: 900;
    }

    .welcome h1 {
      margin: 0;
      font-size: clamp(25px, 5vw, 36px);
      letter-spacing: -1.2px;
    }

    .welcome p {
      max-width: 380px;
      margin: 13px 0 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }

    .message {
      display: flex;
      gap: 13px;
      margin: 0 0 27px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .message-avatar {
      width: 31px;
      height: 31px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: #292929;
      font-size: 13px;
      font-weight: 750;
    }

    .message.user .message-avatar {
      background: var(--accent);
      color: #111;
    }

    .message-content { min-width: 0; flex: 1; }
    .message-role { margin-bottom: 5px; font-size: 12px; color: var(--muted); }
    .message-text { white-space: pre-wrap; }

    .message-text pre {
      max-width: 100%;
      overflow-x: auto;
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #090909;
      font-size: 13px;
    }

    .composer-area {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 10px 25px 20px;
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 12px;
      border: 1px solid #3a3a3a;
      border-radius: 17px;
      background: #1b1b1b;
      box-shadow: 0 8px 35px #0005;
    }

    .composer textarea {
      flex: 1;
      min-height: 27px;
      max-height: 160px;
      resize: none;
      border: 0;
      outline: none;
      background: transparent;
      color: white;
      line-height: 1.5;
      font-size: 15px;
    }

    .composer textarea::placeholder { color: #777; }

    .send {
      width: 37px;
      height: 37px;
      flex-shrink: 0;
      border: 0;
      border-radius: 11px;
      background: var(--accent);
      color: #111;
      font-size: 19px;
      font-weight: 800;
      cursor: pointer;
    }

    .send:disabled { opacity: .4; cursor: default; }

    .disclaimer {
      margin-top: 10px;
      color: #777;
      text-align: center;
      font-size: 11px;
    }

    .typing { color: var(--muted); font-size: 13px; }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 5;
      background: #0008;
    }

    @media (max-width: 700px) {
      .sidebar {
        position: fixed;
        z-index: 10;
        top: 0;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
      }

      .sidebar.open { transform: translateX(0); }
      .overlay.show { display: block; }
      .menu-button { display: block; }
      .topbar { padding: 0 15px; }
      .messages { padding: 22px 15px; }
      .composer-area { padding: 8px 12px 14px; }
      .model { font-size: 11px; }
    }
  </style>
</head>

<body>
<div class="app">
  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon">G</div>
      Gubka-GPT
    </div>

    <button class="new-chat" onclick="newChat()">＋ Новый чат</button>

    <div class="history-title">История</div>
    <div class="history" id="history"></div>

    <div class="profile">
      <div class="avatar">G</div>
      <div>
        <div class="profile-name">Gubka-GPT</div>
        <div class="profile-status">AI Assistant</div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="menu-button" onclick="toggleSidebar()">☰</button>
        <div class="top-title">Новый чат</div>
      </div>
      <div class="model">Gubka AI</div>
    </header>

    <section class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-logo">G</div>
        <h1>Чем могу помочь?</h1>
        <p>Программирование, разработка проектов, работа с GitHub и ответы на любые вопросы.</p>
      </div>
    </section>

    <div class="composer-area">
      <div class="composer">
        <textarea id="prompt" rows="1" placeholder="Напишите сообщение Gubka-GPT..."></textarea>
        <button class="send" id="send" onclick="sendMessage()">↑</button>
      </div>
      <div class="disclaimer">Gubka-GPT может допускать ошибки. Проверяйте важную информацию.</div>
    </div>
  </main>
</div>

<script>
  const messages = document.getElementById("messages");
  const promptInput = document.getElementById("prompt");
  const sendButton = document.getElementById("send");

  let chatId = crypto.randomUUID();
  let chats = [];

  function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("open");
    document.getElementById("overlay").classList.toggle("show");
  }

  function newChat() {
    chatId = crypto.randomUUID();
    messages.innerHTML = `
      <div class="welcome" id="welcome">
        <div class="welcome-logo">G</div>
        <h1>Чем могу помочь?</h1>
        <p>Программирование, разработка проектов, работа с GitHub и ответы на любые вопросы.</p>
      </div>`;
    document.querySelector(".top-title").textContent = "Новый чат";
    if (window.innerWidth <= 700) toggleSidebar();
  }

  function addMessage(role, text) {
    const welcome = document.getElementById("welcome");
    if (welcome) welcome.remove();

    const item = document.createElement("div");
    item.className = "message " + role;

    const avatar = document.createElement("div");
    avatar.className = "message-avatar";
    avatar.textContent = role === "user" ? "Вы" : "G";

    const content = document.createElement("div");
    content.className = "message-content";

    const label = document.createElement("div");
    label.className = "message-role";
    label.textContent = role === "user" ? "Вы" : "Gubka-GPT";

    const body = document.createElement("div");
    body.className = "message-text";
    body.textContent = text;

    content.append(label, body);
    item.append(avatar, content);
    messages.appendChild(item);
    messages.scrollTop = messages.scrollHeight;
  }

  function renderHistory() {
    const history = document.getElementById("history");
    history.innerHTML = "";

    chats.forEach(chat => {
      const button = document.createElement("button");
      button.className = "history-item";
      button.textContent = chat.title;
      button.onclick = () => {
        chatId = chat.id;
        if (window.innerWidth <= 700) toggleSidebar();
      };
      history.appendChild(button);
    });
  }

  async function sendMessage() {
    const text = promptInput.value.trim();
    if (!text || sendButton.disabled) return;

    addMessage("user", text);
    promptInput.value = "";
    promptInput.style.height = "auto";
    sendButton.disabled = true;

    const typing = document.createElement("div");
    typing.className = "typing";
    typing.textContent = "Gubka-GPT думает...";
    messages.appendChild(typing);
    messages.scrollTop = messages.scrollHeight;

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: text,
          chat_id: chatId,
          initData: window.Telegram?.WebApp?.initData || ""
        })
      });

      const data = await response.json();
      typing.remove();

      if (!response.ok) {
        throw new Error(data.error || "Ошибка сервера: " + response.status);
      }

      addMessage("assistant", data.reply || data.answer || "Сервер не вернул ответ.");

      if (!chats.some(chat => chat.id === chatId)) {
        chats.unshift({
          id: chatId,
          title: text.slice(0, 35)
        });
        renderHistory();
      }
    } catch (error) {
      typing.remove();
      addMessage("assistant", "Не удалось получить ответ: " + error.message);
    } finally {
      sendButton.disabled = false;
      promptInput.focus();
    }
  }

  promptInput.addEventListener("input", () => {
    promptInput.style.height = "auto";
    promptInput.style.height = Math.min(promptInput.scrollHeight, 160) + "px";
  });

  promptInput.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });

  if (window.Telegram?.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }
</script>
</body>
</html>
